<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>D3 Graph Viewer</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div id="app">

    <!-- Stats summary bar -->
    <header id="stats-bar" class="hidden" aria-label="Graph statistics"></header>

    <div id="main">
      <!-- Graph canvas -->
      <main id="graph-container">
        <div id="loading-overlay" class="hidden" role="status" aria-live="assertive">
          <div class="loading-content">
            <div class="loading-spinner" aria-hidden="true"></div>
            <div class="loading-text">Computing layout...</div>
          </div>
        </div>
        <!-- Pause/resume overlay button -->
        <button id="btn-pause" type="button" class="pause-overlay hidden" aria-label="Pause simulation">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true">
            <rect class="pause-bar" x="6" y="4" width="4" height="16" rx="1"/>
            <rect class="pause-bar" x="14" y="4" width="4" height="16" rx="1"/>
            <polygon class="play-arrow" points="7,4 20,12 7,20"/>
          </svg>
        </button>
        <!-- Drop zone (shown until file is loaded) -->
        <div id="drop-zone" role="button" tabindex="0" aria-label="Upload graph JSON file">
          <div class="drop-icon" aria-hidden="true">📊</div>
          <div class="drop-text">Drop a graph JSON file here</div>
          <div class="drop-hint">or press Enter to browse</div>
        </div>
      </main>

      <!-- Sidebar -->
      <aside id="sidebar" class="hidden" aria-label="Graph controls">
        <!-- Graph actions -->
        <div class="sidebar-section sidebar-actions">
          <button id="btn-expand-all" type="button" class="action-btn">Expand All</button>
          <button id="btn-collapse-all" type="button" class="action-btn">Collapse All</button>
          <label class="action-toggle" id="toggle-labels">
            <input type="checkbox" checked>
            <span>Labels</span>
          </label>
        </div>

        <!-- Search -->
        <div class="sidebar-section">
          <h2 class="sidebar-heading">Search</h2>
          <div class="sidebar-section-body">
            <label for="search-input" class="sr-only">Search nodes</label>
            <input id="search-input" type="text" placeholder="Search nodes…" role="combobox" aria-expanded="false" aria-autocomplete="list" aria-controls="search-results">
            <div id="search-results" class="hidden" role="listbox" aria-label="Search results"></div>
          </div>
        </div>

        <!-- Type filters -->
        <div class="sidebar-section">
          <h2 class="sidebar-heading">Node Types</h2>
          <div class="sidebar-section-body">
            <div id="type-filters" role="group" aria-label="Filter by node type"></div>
          </div>
        </div>

        <!-- Attribute mapping -->
        <div class="sidebar-section">
          <h2 class="sidebar-heading">Visual Mapping</h2>
          <div class="sidebar-section-body">
            <div id="attr-selectors"></div>
            <div id="color-legend" class="hidden"></div>
          </div>
        </div>

        <!-- Force controls -->
        <div class="sidebar-section">
          <h2 class="sidebar-heading">Forces</h2>
          <div class="sidebar-section-body">
            <div id="force-controls"></div>
          </div>
        </div>

        <!-- Detail panel -->
        <div class="sidebar-section sidebar-section-flex" style="flex:1; border-bottom:none;">
          <h2 class="sidebar-heading">Details</h2>
          <div class="sidebar-section-body" style="flex:1; overflow-y:auto;">
            <div id="detail-panel" aria-live="polite">
              <div class="detail-empty">Click a node to see details</div>
            </div>
          </div>
        </div>
      </aside>
    </div>
  </div>

  <!-- Tooltip (positioned absolutely) -->
  <div id="tooltip" class="hidden" role="tooltip" aria-live="polite"></div>

  <!-- Live region for screen reader announcements -->
  <div id="sr-announcements" class="sr-only" aria-live="polite" aria-atomic="true"></div>

  <!-- Hidden file input -->
  <input id="file-input" type="file" accept=".json" style="display:none">

  <!-- D3 v7 from CDN -->
  <script src="https://d3js.org/d3.v7.min.js"></script>

  <!-- App modules -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
